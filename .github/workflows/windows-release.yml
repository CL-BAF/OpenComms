name: Windows release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Inno Setup 6.4.2
        shell: powershell
        run: choco install innosetup --version=6.4.2 --no-progress --yes
      - name: Build executable and installer
        run: npm run build:release
      - name: Smoke-test installed release
        run: npm run test:windows-release
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: opencomms-windows
          path: dist-release/*
