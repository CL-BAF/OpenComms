name: Linux release smoke test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "installer/**"
      - "package.json"
      - "package-lock.json"
      - "install.mjs"
      - ".github/workflows/linux-release.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:unit
      - name: Test summary on failure
        if: failure()
        run: |
          mkdir -p ci-failure
          npm run typecheck > ci-failure/typecheck.txt 2>&1 || true
          npm run test:unit > ci-failure/test-unit.txt 2>&1 || true
          tail -c 20000 ci-failure/typecheck.txt >> ci-failure/combined.txt 2>&1 || true
          tail -c 20000 ci-failure/test-unit.txt >> ci-failure/combined.txt 2>&1 || true
          # Emit failing-test signatures as ::error annotations — those are
          # anonymous-readable via the check-runs annotations API (Platform
          # verified; artifacts + step summaries are auth-gated). Grep failure
          # signatures with context, not a tail: the failing test may sit well
          # before the final lines (Platform diagnosis after run 34691955898).
          if [ -f ci-failure/combined.txt ]; then
            grep -n -A 12 -E "^not ok|# cancelled|ERR_TEST_FAILURE|AssertionError" ci-failure/combined.txt | tail -n 60 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:400}"
            done
            grep -c "not ok" ci-failure/combined.txt > /dev/null 2>&1 || echo "::error::no 'not ok' lines in combined output (see uploaded artifact ci-failure-logs)"
          fi
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-failure-logs
          path: ci-failure/
      - name: Build Linux release tarball
        run: npm run build:release
      - name: Smoke-test Linux release
        run: node scripts/test-linux-release.mjs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: opencomms-linux
          path: dist-release/*