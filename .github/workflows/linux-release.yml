name: Linux release smoke test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "installer/**"
      - "package.json"
      - "package-lock.json"
      - "install.mjs"
      - ".github/workflows/linux-release.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:unit
      - name: Test summary on failure
        if: failure()
        run: |
          mkdir -p ci-failure
          npm run typecheck > ci-failure/typecheck.txt 2>&1 || true
          npm run test:unit > ci-failure/test-unit.txt 2>&1 || true
          tail -c 20000 ci-failure/typecheck.txt >> ci-failure/combined.txt 2>&1 || true
          tail -c 20000 ci-failure/test-unit.txt >> ci-failure/combined.txt 2>&1 || true
          # Decisive amendment (Platform): target the KNOWN internal-stack
          # fragment — the error message always precedes the stack, so a -B 20
          # window around 'internal/test_runner' captures it + the crashing
          # test name. Fallback annotation points to the artifact otherwise.
          if [ -f ci-failure/combined.txt ]; then
            grep -n -B 20 -A 8 "internal/test_runner" ci-failure/combined.txt | head -n 40 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:400}"
            done
            grep -n -A 12 -E "^not ok|# cancelled|ERR_TEST_FAILURE|AssertionError|Cannot find|SyntaxError|^Error" ci-failure/combined.txt | tail -n 60 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:400}"
            done
            head -n 40 ci-failure/combined.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error head::${line:0:400}"
            done
          fi
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-failure-logs
          path: ci-failure/
      - name: Build Linux release tarball
        run: npm run build:release
      - name: Smoke-test Linux release
        run: node scripts/test-linux-release.mjs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: opencomms-linux
          path: dist-release/*