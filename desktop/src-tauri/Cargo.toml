[package]
name = "opencomms-desktop"
version = "0.0.1"
description = "SPIKE (M0, disposable): Tauri v2 shell wrapping the existing OpenComms loopback GUI server. Owns no business logic."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"