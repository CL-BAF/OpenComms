[package]
name = "opencomms-desktop"
version = "1.4.0"
description = "OpenComms Tauri desktop shell with bundled offline assets and an allowlisted coordinator stdio bridge."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
