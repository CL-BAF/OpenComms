[package]
name = "opencomms-desktop"
version = "1.2.0"
description = "OpenComms Tauri Desktop GUI - the owner-facing desktop shell. Owns no business logic; consumes the Orchestrator API (contract v0.3) over loopback."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
